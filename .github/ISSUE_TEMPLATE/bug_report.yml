name: Bug report
description: Report a reproducible problem with the website or repository tooling
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve AI Club · Season 2026–2027. Please do not include security vulnerabilities here; follow SECURITY.md instead.
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable sequence that reproduces the issue.
      placeholder: |
        1. Go to …
        2. Click …
        3. Observe …
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Page or route
      placeholder: https://ai-club-lux.web.app/…
  - type: input
    id: environment
    attributes:
      label: Browser / device / environment
      placeholder: Chrome 153, macOS; iPhone Safari; Node 24.19.0
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or additional context
      description: Add screenshots, logs, or other useful context. Remove secrets and personal data first.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This is not a security vulnerability.
          required: true
